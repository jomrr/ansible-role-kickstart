---
# role: kickstart
# file: defaults/main.yml

# Values shared by all kickstart files. Every key can be overridden per entry
# in kickstart_files. A key that is empty or missing omits its section.
kickstart_defaults:
  # version, url and repos default to the values of the selected distribution
  # in vars/<distribution>-<distribution_major_version>.yml. See `ksvalidator -l`
  # for supported versions.
  # version: F44
  # url: "url --url=https://ftp.fau.de/fedora/linux/releases/44/Everything/x86_64/os/"
  # repos:
  #   - "repo --name=fedora-updates --baseurl=https://ftp.fau.de/fedora/linux/updates/44/Everything/x86_64/ --cost=0"
  # installation mode: graphical, text or cmdline
  target: graphical
  # bootloader settings; the role adds --append with the kernel arguments, so
  # an --append given here is overridden
  bootloader: "bootloader --driveorder=vda --location=mbr"
  # hardware profile selecting the kernel arguments from vars/main.yml:
  # vm (base), intel or amd (base plus bare-metal and vendor IOMMU arguments)
  hardware: vm
  # additional kernel arguments, appended after those of the hardware profile
  kernel_cmdline: []
  # delete partitions
  clearpart: "clearpart --all --drives=vda"
  # partitions take precedence over autopart and autopart over reqpart
  # autopart: "autopart --type=btrfs"
  # reqpart: "reqpart --add-boot"
  # partitions
  partitions:
    - "part /boot/efi --ondrive=vda --size=512      --fstype=efi   --fsoptions=\"umask=0077,shortname=winnt\""
    - "part /proc                                   --fstype=proc  --fsoptions=\"defaults,hidepid=2\""
    - "part btrfs.0   --ondrive=vda --size=1 --grow --fstype=btrfs --fsoptions=\"compress=zstd:3,noatime\""
  # logical volumes
  logvols: []
  # volume groups
  volgroups: []
  # btrfs volumes
  btrfs_volumes:
    - "btrfs none                 --label=system               btrfs.0"
  # btrfs subvolumes
  btrfs_subvolumes:
    - "btrfs /boot                --subvol --name=@boot        system"
    - "btrfs /                    --subvol --name=@            system"
    - "btrfs /home                --subvol --name=@home        system"
    - "btrfs /opt                 --subvol --name=@opt         system"
    - "btrfs /srv                 --subvol --name=@srv         system"
    - "btrfs /var                 --subvol --name=@var         system"
    - "btrfs /var/lib             --subvol --name=@varlib      system"
    - "btrfs /var/lib/containers  --subvol --name=@containers  system"
    - "btrfs /var/lib/machines    --subvol --name=@machines    system"
    - "btrfs /var/lib/portables   --subvol --name=@portables   system"
    - "btrfs /var/log             --subvol --name=@log         system"
    - "btrfs /var/log/audit       --subvol --name=@audit       system"
    - "btrfs /var/spool/mail      --subvol --name=@mail        system"
    - "btrfs /var/tmp             --subvol --name=@tmp         system"
    - "btrfs /var/www             --subvol --name=@www         system"
  # network interfaces
  networks:
    - "network --bootproto=dhcp"
  # firewall configuration
  firewall: "firewall --enabled --ssh"
  # service configuration
  services: "services --enabled=auditd,sshd"
  # selinux status
  selinux: "selinux --enforcing"
  # do not configure x window system
  skipx: true
  # configure x window system
  xconfig: ''
  # configure authentication
  authselect: ''
  # create user groups
  groups: []
  # create users
  users: []
  # the root password stays locked; access is granted through ssh keys only
  rootpw: "rootpw --lock"
  # ssh keys; ksvalidator accepts one sshkey command per user, so only the
  # first key published on GitHub is used. It is loaded on every run.
  sshkeys:
    - sshkey --username=root "{{ lookup('ansible.builtin.url', 'https://github.com/jomrr.keys', wantlist=true) | first }}"
  # restrict ssh access during installation
  sshpw: ''
  # configure system password policies
  pwpolicies: []
  # pwpolicies:
  #   - "pwpolicy root --minlen=16 --minquality=80 --strict --notempty --nochanges"
  #   - "pwpolicy user --minlen=16 --minquality=60 --strict --notempty --nochanges"
  # join realm or ad domain
  realm: ''
  # keyboard and keymap settings
  keyboard: "keyboard --vckeymap=de --xlayouts=de"
  # language settings
  language: "lang en_US.UTF-8 --addsupport=de_DE.UTF-8"
  # timezone
  timezone: "timezone Europe/Berlin --utc"
  # timesource: ntp server, pool or disable
  timesource: "timesource --ntp-pool de.pool.ntp.org"
  # vnc remote access
  vnc: ''
  # packages added to the common and distribution package lists from vars/
  packages: []
  # system operation after installation, can be halt, reboot, poweroff, shutdown
  finish: "reboot --eject"
  # built-in post scripts from files/post/, rendered in this order; an entry
  # in kickstart_files can switch a single script off
  post_scripts:
    disable-coredumps: true
    modprobe-blacklist-drivers: true
    modprobe-blacklist-fs: true
    modprobe-blacklist-net: true
    harden-sysctl-net-ipv4: true
    harden-sysctl-net-ipv6: true
    harden-sysctl: true
    systemd-disable-sleep: true
  # additional post-install actions, rendered after the built-in post scripts
  # post: |-
  #   cat << EOF >> /etc/modprobe.d/hardening.conf
  #   install cramfs /bin/true
  #   install freevxfs /bin/true
  #   install jffs2 /bin/true
  #   install hfs /bin/true
  #   install hfsplus /bin/true
  #   install squashfs /bin/true
  #   install udf /bin/true
  #   install dccp /bin/true
  #   install sctp /bin/true
  #   install rds /bin/true
  #   install tipc /bin/true
  #   install usb_storage /bin/true
  #   EOF
  # If you define template, only this will be used
  # template:

# Kickstart files to create. Each entry is merged over kickstart_defaults and
# requires dest, distribution and distribution_major_version. The last two
# select the file vars/<distribution>-<distribution_major_version>.yml.
kickstart_files: []
