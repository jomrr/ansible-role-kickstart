---
# role: kickstart
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
  inventory:
    host_vars:
      kickstart-almalinux:
        kickstart_files:
          - dest: "/tmp/kickstart-almalinux.ks"
            distribution: "AlmaLinux"
            distribution_major_version: "10"
            hardware: "amd"
            networks:
              - "network --bootproto=dhcp --hostname=almalinux.kickstart.test"
        __kickstart_test_expected:
          - "zerombr"
          - "--append=\"amd_iommu=force_isolation mitigations=auto"
          - "dnf-automatic"
          - "--hostname=almalinux.kickstart.test"
          - "rootpw --lock"
          - "sshkey --username=root"
      kickstart-fedora:
        kickstart_files:
          - dest: "/tmp/kickstart-fedora.ks"
            distribution: "Fedora"
            distribution_major_version: "44"
            kernel_cmdline:
              - "console=ttyS0"
            networks:
              - "network --bootproto=dhcp --hostname=fedora.kickstart.test"
        __kickstart_test_expected:
          - "zerombr"
          - "--append=\"mitigations=auto"
          - "vsyscall=none console=ttyS0\""
          - "vim-default-editor"
          - "--hostname=fedora.kickstart.test"
          - "rootpw --lock"
          - "sshkey --username=root"
verifier:
  name: "ansible"
scenario:
  name: "dev"
platforms:
  - pre_build_image: true
    override_command: false
    systemd: "true"
    name: "kickstart-almalinux"
    image: "docker.io/${uns:-jomrr}/molecule-almalinux:10"
  - pre_build_image: true
    override_command: false
    systemd: "true"
    name: "kickstart-fedora"
    image: "docker.io/${uns:-jomrr}/molecule-fedora:latest"
