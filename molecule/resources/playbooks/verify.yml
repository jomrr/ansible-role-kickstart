---
# role: kickstart
# file: molecule/resources/playbooks/verify.yml

- name: KICKSTART | Verify the generated kickstart file
  hosts: all
  gather_facts: false
  tasks:
    - name: KICKSTART | Read the generated kickstart file
      ansible.builtin.slurp:
        src: "{{ kickstart_files[0].dest }}"
      register: __kickstart_rendered

    - name: KICKSTART | Assert that every layer reached the kickstart file
      ansible.builtin.assert:
        that: __kickstart_expected in (__kickstart_rendered.content | b64decode)
        quiet: true
      loop: "{{ __kickstart_test_expected }}"
      loop_control:
        loop_var: __kickstart_expected
        label: "{{ __kickstart_expected }}"

    - name: KICKSTART | Assert that switched-off post scripts are not rendered
      ansible.builtin.assert:
        that: __kickstart_unexpected not in (__kickstart_rendered.content | b64decode)
        quiet: true
      loop: "{{ __kickstart_test_unexpected }}"
      loop_control:
        loop_var: __kickstart_unexpected
        label: "{{ __kickstart_unexpected }}"
