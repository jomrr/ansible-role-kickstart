---
# role: kickstart
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
  inventory:
    host_vars:
      kickstart-cross:
        kickstart_files:
          - dest: "/tmp/kickstart-cross.ks"
            distribution: "AlmaLinux"
            distribution_major_version: "10"
            networks:
              - "network --bootproto=dhcp --hostname=cross.kickstart.test"
        __kickstart_test_expected:
          - "#version=RHEL10"
          - "--fstype=btrfs"
          - "--hostname=cross.kickstart.test"
        __kickstart_test_unexpected:
          - "vim-default-editor"
      kickstart-almalinux:
        kickstart_files:
          - dest: "/tmp/kickstart-almalinux.ks"
            distribution: "AlmaLinux"
            distribution_major_version: "10"
            hardware: "amd"
            luks_passphrase: "molecule-luks"
            partitions:
              - "part /boot/efi --ondrive=vda --size=2048 --fstype=efi"
              - "part /boot --ondrive=vda --size=2048 --fstype=ext4"
              - "part btrfs.0 --ondrive=vda --size=1 --grow --fstype=btrfs --encrypted --luks-version=luks2"
            networks:
              - "network --bootproto=dhcp --hostname=almalinux.kickstart.test"
        __kickstart_test_expected:
          - "zerombr"
          - "--append=\"amd_iommu=force_isolation mitigations=auto"
          - "--encrypted --luks-version=luks2 --passphrase=molecule-luks"
          - "ks-post-tpm-cryptenroll.log --erroronfail"
          - "KS_TPM2_PCRS=7+14+15:sha256="
          - "KS_LUKS_PASSPHRASE=molecule-luks"
          - "--excludedocs"
          - "python3-dnf"
          - "python3-virt-firmware"
          - "tpm2-tools"
          - "amd-gpu-firmware"
          - "--hostname=almalinux.kickstart.test"
          - "rootpw --lock"
          - "sshkey --username=root"
          - "ks-post-dnf.log"
          - "ks-post-dnf-automatic.log"
          - "systemctl enable dnf-automatic.timer"
          - "ks-post-disable-coredumps.log"
          - "ks-post-modprobe-blacklist-drivers.log"
          - "ks-post-modprobe-blacklist-fs.log"
          - "ks-post-modprobe-blacklist-net.log"
          - "ks-post-harden-sysctl-net-ipv4.log"
          - "ks-post-harden-dev-shm.log"
          - "ks-post-harden-sysctl-net-ipv6.log"
          - "ks-post-harden-sysctl.log"
          - "ks-post-systemd-disable-sleep.log"
          - "systemctl mask sleep.target"
        __kickstart_test_unexpected:
          - "qemu-guest-agent"
          - "intel-gpu-firmware"
          - "python3-libdnf5"
          - "dnf5-automatic.timer"
      kickstart-fedora:
        kickstart_files:
          - dest: "/tmp/kickstart-fedora.ks"
            distribution: "Fedora"
            distribution_major_version: "44"
            kernel_cmdline:
              - "console=ttyS0"
            post_scripts:
              systemd-disable-sleep: false
            networks:
              - "network --bootproto=dhcp --hostname=fedora.kickstart.test"
        __kickstart_test_expected:
          - "zerombr"
          - "--append=\"mitigations=auto"
          - "vsyscall=none console=ttyS0\""
          - "--excludedocs"
          - "qemu-guest-agent"
          - "-amd-gpu-firmware"
          - "-intel-gpu-firmware"
          - "python3-libdnf5"
          - "vim-default-editor"
          - "--hostname=fedora.kickstart.test"
          - "rootpw --lock"
          - "sshkey --username=root"
          - "systemctl enable dnf5-automatic.timer"
          - "reboot = when-needed"
          - "ks-post-harden-sysctl.log"
        __kickstart_test_unexpected:
          - "ks-post-systemd-disable-sleep.log"
          - "ks-post-tpm-cryptenroll.log"
          - "--passphrase="
          - "dnf-automatic.timer"
          - "python3-dnf"
          - "python3-virt-firmware"
          - "tpm2-tools"
verifier:
  name: "ansible"
scenario:
  name: "default"
platforms:
  - pre_build_image: true
    override_command: false
    systemd: "true"
    name: "kickstart-${img:-almalinux}"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-almalinux}:${tag:-10}"
