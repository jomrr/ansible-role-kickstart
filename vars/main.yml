---
# role: kickstart
# file: vars/main.yml

# Commands rendered into every kickstart file.
__kickstart_commands:
  - "eula --agreed"
  - "firstboot --disable"
  - "zerombr"

# Anaconda add-on sections rendered into every kickstart file.
__kickstart_addons:
  - "com_redhat_kdump --disable"

# Kernel command line argument sets.
__kickstart_kernel_cmdline:
  base:
    - mitigations=auto
    - debugfs=off
    - init_on_alloc=1
    - init_on_free=1
    - kexec_load_disabled=1
    - lockdown=integrity
    - module.sig_enforce=1
    - page_alloc.shuffle=1
    - pti=on
    - randomize_kstack_offset=on
    - slab_nomerge
    - spec_store_bypass_disable=on
    - vsyscall=none
  metal:
    - efi=disable_early_pci_dma
    - iommu=force
    - iommu.strict=1
  amd:
    - amd_iommu=force_isolation
  intel:
    - intel_iommu=on

# Package sets and kernel argument sets rendered for each hardware profile, in
# this order. The package set all is rendered for every profile.
__kickstart_hardware_profiles:
  vm:
    packages: [vm]
    kernel_cmdline: [base]
  intel:
    packages: [metal, intel]
    kernel_cmdline: [intel, base, metal]
  amd:
    packages: [metal, amd]
    kernel_cmdline: [amd, base, metal]

# Options of the packages section.
__kickstart_packages_options:
  - --ignoremissing
  - --exclude-weakdeps
  - --excludedocs
  - --inst-langs=de_DE,en_US

# Package sets installed or removed on every supported distribution.
__kickstart_common_packages:
  all:
    - "@core"
    - audit
    - bash-completion
    - cracklib
    - cracklib-dicts
    - firewalld
    - libpwquality
    - policycoreutils-python-utils
    - python3-pwquality
    - zstd
    - -ModemManager-*
    - -abrt*
    - -avahi*
    - -bluez*
    - -brcmfmac-firmware
    - -cirrus-audio-firmware
    - -iw*
    - -mt7xxx-firmware
    - -nano
    - -nodejs*
    - -nvidia-gpu-firmware
    - -nxpwireless-firmware
    - -perl*
    - -samba*
    - -setroubleshoot*
    - -sssd*
    - -zram-generator-*
  vm:
    - qemu-guest-agent
    - -amd-gpu-firmware
    - -intel-gpu-firmware
    - -linux-firmware
  metal:
    - fwupd
    - linux-firmware
    - microcode_ctl
    - nvme-cli
    - python3-virt-firmware
    - smartmontools
    - systemd-pam
    - tpm2-tools
    - tpm2-tss
  intel:
    - intel-gpu-firmware
  amd:
    - amd-gpu-firmware
