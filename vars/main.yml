---
# role: kickstart
# file: vars/main.yml

# Validator of a kickstart file. The ksvalidator of the executing host validates
# files of its own distribution. Files of another distribution are validated
# with the pykickstart source tree of their distribution, see
# __kickstart_validator_source in the distribution files. __kickstart_host holds
# the facts of the host that executes the tasks, which differs from the
# inventory host when the tasks are delegated.
__kickstart_validator: "{{ (__kickstart_item.distribution == __kickstart_host.ansible_facts.ansible_distribution) | ternary('native', 'source') }}"

# Directory of the pykickstart source tree of one distribution.
__kickstart_validator_path: "{{ __kickstart_host.ansible_facts.ansible_user_dir }}/.cache/kickstart-validator/{{ __kickstart_validator_source.name }}"

# Validate commands of the template task, selected by __kickstart_validator.
__kickstart_validate_commands:
  native: "ksvalidator --version={{ __kickstart_file.version }} %s"
  source: >-
    env PYTHONPATH={{ __kickstart_validator_path }}/src
    python3 {{ __kickstart_validator_path }}/src/tools/ksvalidator.py
    --version={{ __kickstart_file.version }} %s

# Commands rendered into every kickstart file.
__kickstart_commands:
  - "eula --agreed"
  - "firstboot --disable"
  - "zerombr"

# Anaconda add-on sections rendered into every kickstart file.
__kickstart_addons:
  - "com_redhat_kdump --disable"

# Kernel command line argument sets.
__kickstart_kernel_cmdline:
  base:
    - mitigations=auto
    - debugfs=off
    - init_on_alloc=1
    - init_on_free=1
    - kexec_load_disabled=1
    - lockdown=integrity
    - module.sig_enforce=1
    - page_alloc.shuffle=1
    - pti=on
    - randomize_kstack_offset=on
    - slab_nomerge
    - spec_store_bypass_disable=on
    - vsyscall=none
  metal:
    - efi=disable_early_pci_dma
    - iommu=force
    - iommu.strict=1
  amd:
    - amd_iommu=force_isolation
  intel:
    - intel_iommu=on

# Package sets and kernel argument sets rendered for each hardware profile, in
# this order. The package set all is rendered for every profile. post_scripts
# holds the defaults of post scripts that depend on the hardware; the
# post_scripts key of a kickstart file overrides them.
__kickstart_hardware_profiles:
  vm:
    packages: [vm]
    kernel_cmdline: [base]
    post_scripts:
      tpm-cryptenroll: false
  intel:
    packages: [metal, intel]
    kernel_cmdline: [intel, base, metal]
    post_scripts:
      tpm-cryptenroll: true
  amd:
    packages: [metal, amd]
    kernel_cmdline: [amd, base, metal]
    post_scripts:
      tpm-cryptenroll: true

# Options and shell variables of single post scripts. The value of a variable
# comes from the named key of the kickstart file.
__kickstart_post_script_settings:
  tpm-cryptenroll:
    options: --erroronfail
    variables:
      KS_TPM2_PCRS: tpm2_pcrs
      KS_LUKS_PASSPHRASE: luks_passphrase

# Options of the packages section.
__kickstart_packages_options:
  - --ignoremissing
  - --exclude-weakdeps
  - --excludedocs
  - --inst-langs=de_DE,en_US

# Package sets installed or removed on every supported distribution.
__kickstart_common_packages:
  all:
    - "@core"
    - audit
    - bash-completion
    - cracklib
    - cracklib-dicts
    - firewalld
    - libpwquality
    - policycoreutils-python-utils
    - python3-pwquality
    - zstd
    - -ModemManager-*
    - -abrt*
    - -avahi*
    - -bluez*
    - -brcmfmac-firmware
    - -cirrus-audio-firmware
    - -iw*
    - -mt7xxx-firmware
    - -nano
    - -nodejs*
    - -nvidia-gpu-firmware
    - -nxpwireless-firmware
    - -perl*
    - -samba*
    - -setroubleshoot*
    - -sssd*
    - -zram-generator-*
  vm:
    - qemu-guest-agent
    - -amd-gpu-firmware
    - -intel-gpu-firmware
    - -linux-firmware
  metal:
    - fwupd
    - linux-firmware
    - microcode_ctl
    - nvme-cli
    - python3-virt-firmware
    - smartmontools
    - systemd-pam
    - tpm2-tools
    - tpm2-tss
  intel:
    - intel-gpu-firmware
  amd:
    - amd-gpu-firmware
